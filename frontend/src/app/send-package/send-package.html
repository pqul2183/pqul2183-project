
<form [formGroup]="form" (ngSubmit)="submit()">
  <h2>Send a package</h2>
  <br>
  <div>
    <label for="origin" style="color: rgb(255, 255, 255);">Select Origin City:</label>
    <br>
    <select id="origin" formControlName="originCityId">
      <option [ngValue]="null" disabled>Origin City</option>
      <option *ngFor="let city of cities" [value]="city.UUID">{{ city.name }}</option>
    </select>
  </div>
  <br>
  <div>
    <label for="destination" style="color: white;">Select Destination City:</label>
    <br>
    <select id="destination" formControlName="destinationCityId">
      <option  [ngValue]="null" disabled>Destination City</option>
      <option *ngFor="let city of cities" [value]="city.UUID">{{ city.name }}</option>
    </select>
  </div>
  <br>
  <div>
    <label for="freight" style="color: white;">Freight type: </label>
    <br>
    <select id="freight" formControlName="freightType">
      <option value="AIR">Air</option>
      <option value="SEA">Sea</option>
    </select>
  </div>
  <br>
  <button type="submit" [disabled]="submitted">Send package</button>
  <br>
  <br>
  <button onclick="window.open('http://localhost:4200/overview','_self')">Shipment overview</button>
</form>

<p *ngIf="successMessage">{{ successMessage }}</p>
